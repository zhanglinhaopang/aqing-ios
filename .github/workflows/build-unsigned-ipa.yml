name: Build unsigned IPA

# 手动触发：仓库页面 → Actions → Build unsigned IPA → Run workflow
# 公开仓库的 macOS runner 完全免费；私有仓库会按 10 倍扣 macOS 分钟数。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Aqing/**'
      - 'Aqing.xcodeproj/**'
      - '.github/workflows/build-unsigned-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (unsigned, arm64)
        run: |
          # 手写 pbxproj 没有 shared scheme，用 -target 绕开 "Scheme is not configured"
          xcodebuild \
            -project Aqing.xcodeproj \
            -target Aqing \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Pack IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Aqing.app build/Payload/
          (cd build && zip -qr Aqing-unsigned.ipa Payload)

      - name: Verify
        run: |
          ls -lh build/Aqing-unsigned.ipa
          unzip -l build/Aqing-unsigned.ipa | grep -E 'Aqing.app/(Aqing|Info.plist)'

      - uses: actions/upload-artifact@v4
        with:
          name: Aqing-unsigned-ipa
          path: build/Aqing-unsigned.ipa
          retention-days: 30
